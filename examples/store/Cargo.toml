[package]
name = "kobo-store"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "kobo-store"
path = "src/main.rs"

[dependencies]
kobo-json = { path = "../../crates/kobo-json" }
kobo-sdk = { path = "../../crates/kobo-sdk", features = ["runtime-settings"] }
qrcodegen = "1.8"

[dev-dependencies]
kobo-catalog = { path = "../../crates/kobo-catalog" }
kobo-profile = { path = "../../crates/kobo-profile" }
kobo-ui = { path = "../../crates/kobo-ui" }

[lints]
workspace = true
