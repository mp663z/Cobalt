[package]
name = "kobo-text"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Real type for the Kobo application platform"

[dependencies]
fontdue = "=0.9.3"
rustybuzz = "=0.20.1"
kobo-ui = { version = "0.3.2", path = "../kobo-ui" }
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.12"

[lints]
workspace = true

[features]
# TEST/DIAGNOSTIC ONLY: native font session for the paint-proof lane.
# Off in the normal production graph; see the 114 contract.
diagnostic-font-session = ["native-font-session"]
# Internal font-session capability; compiled when explicitly selected by the app. Compilation does not enable
# preparation or rendering. Snapshot and limit APIs remain diagnostic and define no device or production policy.
# Narrower than `diagnostic-font-session`: it compiles ONLY the native session module (bundled_face_pair stays
# behind the diagnostic feature). Amends the 114 build-graph contract ("off in the normal production graph").
native-font-session = []
