<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sample form</title></head>
<body><h1>Sample form</h1><p>Try the controls. This form searches a local sample page.</p>
<form action="links.html" method="get">
<label for="query">Search words</label><input id="query" type="search" name="q" value="paper">
<label for="size">Size</label><select id="size" name="size"><option value="small">Small</option><option value="large" selected>Large</option></select>
<label><input type="checkbox" name="only" value="yes">Available only</label>
<input type="hidden" name="from" value="sample">
<input type="submit" value="Search">
</form>
</body></html>
