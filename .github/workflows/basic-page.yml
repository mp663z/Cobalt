name: Basic page corpus

on:
  push:
    paths:
      - 'crates/kobo-web-document/**'
      - 'crates/kobo-text/fonts/**'
      - 'tools/cobalt-text-preview/**'
      - '.github/workflows/basic-page.yml'
  pull_request:
    paths:
      - 'crates/kobo-web-document/**'
      - 'crates/kobo-text/fonts/**'
      - 'tools/cobalt-text-preview/**'
      - '.github/workflows/basic-page.yml'

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.85.1
          components: clippy, rustfmt
      - name: Check the portable harness formatting
        run: rustfmt --edition 2021 --check tools/cobalt-text-preview/src/basic_preview.rs tools/cobalt-text-preview/src/bin/basic-page.rs tools/cobalt-text-preview/tests/basic_corpus.rs
      - name: Check the portable harness lints
        run: cargo clippy --locked --manifest-path tools/cobalt-text-preview/Cargo.toml --lib --bin basic-page --test basic_corpus -- -D warnings
      - name: Check census and existing preview tests
        run: cargo test --locked --manifest-path tools/cobalt-text-preview/Cargo.toml --all-targets
      - name: Install the host PNG compositor
        run: python3 -m pip install Pillow==12.0.0
      - name: Verify frozen bytes and white composition
        run: python3 -m unittest discover -s tools/cobalt-text-preview -p test_corpus.py
