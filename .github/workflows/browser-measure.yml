name: Browser measurement spike

on:
  push:
    branches: [agent/browser-m0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  armv7-sizes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.85.1
          targets: armv7-unknown-linux-musleabihf
      - name: Install the ring C cross-compiler
        run: sudo apt-get update && sudo apt-get install --yes gcc-arm-linux-gnueabihf
      # The device target is musl, but the C in the dependency tree was being
      # compiled by the glibc armhf cross-compiler. Ubuntu's armhf toolchain
      # now defaults to 64-bit time_t, so SQLite's calls to stat, fcntl and
      # nanosleep emit glibc's __stat64_time64 and friends, which musl has
      # never defined. Nothing noticed while only ring compiled C, because it
      # calls none of them. Zig ships musl headers for every target it emits,
      # so it is the cross-compiler for the device rather than a fourth apt
      # package pretending musl and glibc are interchangeable.
      - name: Install the musl cross-compiler the device C needs
        run: |
          set -eu
          # Community mirrors listed at https://ziglang.org/download/community-mirrors.txt.
          # Every source must match the same reviewed digest before extraction.
          # Bound each attempt: ziglang.org has stalled indefinitely on CI runners.
          zig_downloaded=false
          for zig_url in \
            'https://pkg.hexops.org/zig/zig-x86_64-linux-0.16.0.tar.xz?source=cobalt-ci' \
            'https://ziglang.freetls.fastly.net/zig-x86_64-linux-0.16.0.tar.xz?source=cobalt-ci' \
            'https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz'; do
            if curl -fL --connect-timeout 15 --max-time 120 \
              --speed-limit 1024 --speed-time 20 -o /tmp/zig.tar.xz "$zig_url" \
              && echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/zig.tar.xz" \
                | sha256sum -c -; then
              zig_downloaded=true
              break
            fi
            echo "::warning::Could not obtain the pinned Zig archive from $zig_url"
          done
          if [ "$zig_downloaded" != true ]; then
            echo "No source supplied the pinned Zig archive" >&2
            exit 1
          fi
          sudo tar -xJf /tmp/zig.tar.xz -C /opt
          sudo tee /usr/local/bin/armv7-musl-cc >/dev/null <<'CC'
          #!/bin/sh
          # cc-rs passes --target=armv7-unknown-linux-musleabihf. Zig spells the
          # same machine arm-linux-musleabihf and refuses "armv7", so the triple
          # comes from here and the one we are handed is dropped.
          zig=/opt/zig-x86_64-linux-0.16.0/zig
          count=$#
          index=0
          while [ "$index" -lt "$count" ]; do
            argument="$1"
            shift
            case "$argument" in
              --target=*) ;;
              *) set -- "$@" "$argument" ;;
            esac
            index=$((index + 1))
          done
          # Zig instruments with UBSan by default and does not link its runtime,
          # so sqlite3.c ends up referencing __ubsan_handle_* that nothing
          # defines. The device build is not a sanitiser run.
          exec "$zig" cc -target arm-linux-musleabihf -fno-sanitize=undefined "$@"
          CC
          sudo chmod +x /usr/local/bin/armv7-musl-cc
          armv7-musl-cc --version
      - name: Build release binaries for the device
        env:
          CC_armv7_unknown_linux_musleabihf: armv7-musl-cc
        run: |
          set -eu
          cargo build --locked --release --target armv7-unknown-linux-musleabihf -p kobod -p kobo-hello
          cargo build --locked --release --target armv7-unknown-linux-musleabihf --manifest-path tools/browser-probe/Cargo.toml
      - name: Report stripped sizes
        run: |
          set -eu
          {
            echo '| binary | bytes |'
            echo '| --- | --- |'
            for f in target/armv7-unknown-linux-musleabihf/release/kobod \
                     target/armv7-unknown-linux-musleabihf/release/kobo-hello \
                     tools/browser-probe/target/armv7-unknown-linux-musleabihf/release/probe_baseline \
                     tools/browser-probe/target/armv7-unknown-linux-musleabihf/release/probe_kobodoc \
                     tools/browser-probe/target/armv7-unknown-linux-musleabihf/release/probe_html5ever; do
              echo "| $(basename "$f") | $(stat -c %s "$f") |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
